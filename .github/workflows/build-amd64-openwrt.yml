name: Build AMD64 OpenWrt

concurrency:
  group: build-amd64-${{ inputs.source || github.event.client_payload.source || 'immortalwrt' }}-${{ github.ref }}
  cancel-in-progress: true

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source:
        description: Source repository
        required: true
        default: immortalwrt
        type: choice
        options:
          - immortalwrt
          - lede
  schedule:
    - cron: 0 14 * * 5 
      timezone: Asia/Shanghai 

permissions:
  actions: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt-reusable.yml
    with:
      source: ${{ inputs.source || github.event.client_payload.source || 'immortalwrt' }}
      config_file: config/${{ inputs.source || github.event.client_payload.source || 'immortalwrt' }}/amd64.config
      release_prefix: AMD64-${{ inputs.source || github.event.client_payload.source || 'immortalwrt' }}
    secrets: inherit
